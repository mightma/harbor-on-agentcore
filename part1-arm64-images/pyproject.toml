[project]
name = "part1-arm64-images"
version = "0.1.0"
description = "Build arm64 task images and Harbor task directories for SWE-smith and SWE-bench Verified"
requires-python = ">=3.13"

# swesmith and swebench are pinned, not floated, and both pins are load-bearing:
#
#   swesmith 0.0.6  must match the swesmith adapter's own pin, because the
#                   image names this builds are the names that adapter's
#                   generated tasks reference. A different swesmith renames the images and the
#                   tasks point at nothing.
#   swebench 4.1.0  the adapter imports LATEST from swebench.harness.constants,
#                   which 5.x removed.
dependencies = [
    "swesmith==0.0.6",
    "swebench==4.1.0",
    "datasets>=4.0.0",
    "toml==0.10.2",
    "docker>=7.1.0",
    "boto3>=1.43.48",
    "pandas>=2.0",
    "requests>=2.32",
    # The two Harbor adapters, from harbor-framework/adapters (they moved out of
    # the harbor repo). Each is pinned to the head commit of its open upstream PR
    # on the fork -- adapters#23 carries the SWE-smith patch fix, adapters#22 the
    # SWE-bench --arch flag -- by SHA, so neither can move. See the top-level
    # README for what each carries; repin to upstream once both merge.
    "harbor-swesmith-adapter @ git+https://github.com/mightma/adapters@6530140947414ac1f9954d51e24da5edf590d777#subdirectory=src/swesmith",
    "harbor-swebench-adapter @ git+https://github.com/mightma/adapters@8e27af8513c1de461fe5a0eaa68faeefc346970f#subdirectory=src/swebench",
]

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.uv]
# swesmith 0.0.6 and swebench 4.1.0 disagree about transitive pins; neither
# conflict affects the code paths used here (image naming and test-command
# generation).
override-dependencies = []
